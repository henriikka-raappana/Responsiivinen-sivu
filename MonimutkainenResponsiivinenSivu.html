<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monimutkainen asettelu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header,
        footer {
            background-color: #3f51b5;
            color: #fff;
            padding: 10px;
            text-align: center;
        }

        main {
            padding: 20px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 20px;
        }

        .sidebar {
            background-color: #c5cae9;
            padding: 20px;
        }

        .content {
            background-color: #e8eaf6;
            padding: 20px;
        }

        .content-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .content-box {
            background-color: #9fa8da;
            padding: 20px;
            flex: 1 1 200px;
            text-align: center;
        }

        @media screen and (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Responsiivinen sivu 3</h1>
        <p>Monimutkaisempi asettelu Gridin ja Flexboxin avulla</p>
    </header>
    <main>
        <div class="main-grid">
            <aside class="sidebar">
                <h2>Sivupalkki</h2>
                <p>Tähän voi lisää navigaatiota tai lisätietoja</p>
            </aside>
            <section class="content-flex">
                <div class="content-box">Laatikko 1</div>
                <div class="content-box">Laatikko 2</div>
                <div class="content-box">Laatikko 3</div>
                <div class="content-box">Laatikko 4</div>
        </div>
    </section>
</main>
<footer>
    <p>&copy; 2026 Responsiivinen sivu 3</p>
</footer>
</body>
</html>
