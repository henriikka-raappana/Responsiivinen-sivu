<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex 3 - Monirivinen asettelu</title>

    <style>
        .flex-container {
            display:flex;
            flex-wrap: wrap;
            background: #e1f5fe;
            padding: 10px;
        }

        .item {
            background-color: #81d4fa;
            padding: 20px;
            margin: 10px;
            flex: 1 1 250px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Flex 3 - Monirivinen asedttelu</h1>
    <div class="flex-container">
        <div class="item">Kissa 1</div>
        <div class="item">Kissa 2</div>
        <div class="item">Kissa 3</div>
        <div class="item">Kissa 4</div>
        <div class="item">Kissa 5</div>
    </div>
</body>
</html>
