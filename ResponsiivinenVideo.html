<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsiivinen video</title>

    <style>
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            margin: 20px 0;
        }

        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <h1>Responsiivinen video</h1>
    <p>Video mukautuu säilyttäen 16:9 suhteen</p>
    <div class="video-container">
        <video controls>
            <source src="https://www.pexels.com/download/video/19757146/" type="video/mp4">
    </div>
</body>
</html>
