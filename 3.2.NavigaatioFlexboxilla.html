<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex 2 - Navigaatiopalkki</title>
    <style>
        .navbar {
            display: flex;
            background-color: #3949ab;
            padding: 10px;
            color: white;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .navbar .logo {
            font-size: 1.5em;
        }

        .navbar ul {
            display: flex;
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .navbar li {
            margin: 0 10px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        @media screen and (max-width: 600px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .navbar ul{
                flex-direction: column;
                width: 100%;
            }

            .navbar li {
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Logo</div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <main style="padding: 20px;">
       <h1>Navigaatiopalkin esimerkki</h1>
       <p>tässä navigaatiopalkki käyttää flexboxia ja muuttuu pystysuoraksi pienillä näytöillä</p>
    </main>
</body>
</html>
