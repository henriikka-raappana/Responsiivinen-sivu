<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header ja Footer</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }

        header,
        footer {
            background-color: #283593;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1,
        footer p {
            margin: 0;
        }

        main {
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
    <h1>Sivun otsikko</h1>
    <p>Yrityksen tai sivun nimi</p>
    </header>

    <main>
        <p>Tervemenoa tää on esimerkki perus headerista ja footerista</p>
    </main>

    <footer>
        <p>&copy; 2026 Sivun tekijä. Yhteystiedot: info@sivu.fi</p>
    </footer>
</body>
</html>
