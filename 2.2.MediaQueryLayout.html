<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries 2</title>

    <style>
        .container {
            background-color: #f0f0f0;
            margin: 0 auto;
            padding: 20px;
            width: 80%;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            margin: 20px 0;
            background: #ddd;
            padding: 10px;
        }

        @media (max-width: 768px) {
            .contaier {
                width: 95%;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Media Queries - Layout</h1>
        <p>muuta selaimen leveyttä, marginaalit ja padding muuttuu</p>
    </div>
</body>
</html>
