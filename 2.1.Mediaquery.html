<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries 1, värit ja tekstit</title>

    <style>
        body {
            background-color: lightblue;
            font-size: 18px;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        @media (max-width: 1024px) {
            body {
                background-color: lightgreen;
                font-size: 17px;
            }
        }

        @media (max-width: 768px) {
            body {
                background-color: lightcoral;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            body {
                background-color: rgb(255, 255, 118);
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <h1>Media Queries - värit ja tekstit</h1>
    <p>tässä taustaväri ja fonttikoko muuttuu eri ruudunleveyksillä. kavenna ja levitä nähdäksesi.</p>
</body>
</html>
